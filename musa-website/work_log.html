<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Log</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        select {
            background: white;
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
            margin-top: 10px;
            width: 100%;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .entry {
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f7fafc;
            cursor: pointer;
            transition: all 0.2s;
        }

        .entry:hover {
            border-color: #667eea;
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .entry-type {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .entry-date {
            color: #718096;
            font-size: 13px;
        }

        .entry-title {
            font-weight: 600;
            color: #2d3748;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .entry-content {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.6;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            flex: 1;
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            display: block;
        }

        .stat-label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Work Log</h1>
            <p class="subtitle">Track what you did, why it mattered, what you learned</p>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>Log Entry</h2>
                <form id="entryForm">
                    <div class="input-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Work">Work</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Writing">Writing</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>What did you do?</label>
                        <input type="text" id="task" placeholder="Brief description" required>
                    </div>

                    <div class="input-group">
                        <label>Reflection</label>
                        <textarea id="reflection" placeholder="What went well? What didn't? What are you thinking about?" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Entry</button>
                    
                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="saveToFile()">💾 Save to File</button>
                        <button type="button" class="btn btn-secondary" onclick="exportToCSV()">📥 Download CSV</button>
                    </div>
                </form>

                <div class="stats">
                    <div class="stat-card">
                        <span class="stat-number" id="totalEntries">0</span>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="todayEntries">0</span>
                        <div class="stat-label">Today</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Recent Entries</h2>
                <div id="entriesList" class="entries-list">
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <p>No entries yet. Start logging your work.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('workLog') || '[]');

        function renderEntries() {
            const list = document.getElementById('entriesList');
            
            if (entries.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <p>No entries yet. Start logging your work.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = entries.slice(0, 10).map(entry => `
                <div class="entry">
                    <div class="entry-header">
                        <span class="entry-type">${entry.category}</span>
                        <span class="entry-date">${entry.date} ${entry.time}</span>
                    </div>
                    <div class="entry-title">${entry.task}</div>
                    <div class="entry-content">${truncate(entry.reflection, 150)}</div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalEntries').textContent = entries.length;
            
            const today = new Date().toLocaleDateString();
            const todayCount = entries.filter(e => e.date === today).length;
            document.getElementById('todayEntries').textContent = todayCount;
        }

        function truncate(text, length) {
            return text.length > length ? text.substring(0, length) + '...' : text;
        }

        document.getElementById('entryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const entry = {
                id: Date.now(),
                category: document.getElementById('category').value,
                task: document.getElementById('task').value,
                reflection: document.getElementById('reflection').value,
                timestamp: new Date().toISOString(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString()
            };

            entries.unshift(entry);
            localStorage.setItem('workLog', JSON.stringify(entries));
            
            document.getElementById('task').value = '';
            document.getElementById('reflection').value = '';
            
            renderEntries();
            updateStats();
        });

        function saveToFile() {
            if (entries.length === 0) {
                alert('No entries to save yet.');
                return;
            }

            const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'work_log_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportToCSV() {
            if (entries.length === 0) {
                alert('No entries to export yet.');
                return;
            }

            const headers = ['Timestamp', 'Category', 'Task', 'Reflection'];
            const rows = entries.map(e => [
                e.timestamp,
                e.category,
                e.task,
                e.reflection.replace(/"/g, '""')
            ]);

            const csv = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `work_log_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        renderEntries();
        updateStats();
    </script>
</body>
</html>
