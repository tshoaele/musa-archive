<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Documentation Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-capture {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .capture-btn {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .capture-btn:hover {
            border-color: #667eea;
            background: #f7fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .capture-btn .icon {
            font-size: 24px;
        }

        .capture-btn .label {
            flex: 1;
        }

        .capture-btn .desc {
            font-size: 13px;
            color: #718096;
            margin-top: 3px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #2d3748;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #718096;
            line-height: 1;
        }

        .close-btn:hover {
            color: #2d3748;
        }

        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .entry {
            border: 2px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .entry:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .entry-type {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .entry-date {
            color: #718096;
            font-size: 13px;
        }

        .entry-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .entry-content {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.6;
        }

        .entry-tags {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 4px 10px;
            background: #edf2f7;
            color: #4a5568;
            border-radius: 6px;
            font-size: 12px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            color: white;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        .ai-tag {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #fed7d7;
            color: #c53030;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .recording-indicator.active {
            display: flex;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #c53030;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Work Documentation Hub</h1>
            <p class="subtitle">Capture everything that matters at work</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalEntries">0</div>
                <div class="stat-label">Total Entries</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="thisWeek">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="categories">0</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>📝 Quick Capture</h2>
                <div class="quick-capture">
                    <button class="capture-btn" onclick="openModal('meeting')">
                        <span class="icon">💼</span>
                        <div class="label">
                            Meeting Notes
                            <div class="desc">Record discussions and decisions</div>
                        </div>
                    </button>
                    <button class="capture-btn" onclick="openModal('decision')">
                        <span class="icon">🎯</span>
                        <div class="label">
                            Decision Log
                            <div class="desc">Document key choices and rationale</div>
                        </div>
                    </button>
                    <button class="capture-btn" onclick="openModal('idea')">
                        <span class="icon">💡</span>
                        <div class="label">
                            Ideas & Insights
                            <div class="desc">Capture thoughts and innovations</div>
                        </div>
                    </button>
                    <button class="capture-btn" onclick="openModal('task')">
                        <span class="icon">✅</span>
                        <div class="label">
                            Task/Project Update
                            <div class="desc">Log progress and milestones</div>
                        </div>
                    </button>
                    <button class="capture-btn" onclick="openModal('conversation')">
                        <span class="icon">💬</span>
                        <div class="label">
                            Conversation Summary
                            <div class="desc">Key points from discussions</div>
                        </div>
                    </button>
                    <button class="capture-btn" onclick="openModal('voice')">
                        <span class="icon">🎤</span>
                        <div class="label">
                            Voice Note
                            <div class="desc">Record audio thoughts</div>
                        </div>
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>🔍 Recent Entries</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search entries..." oninput="filterEntries()">
                </div>
                <div class="entries-list" id="entriesList">
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <h3>No entries yet</h3>
                        <p>Start documenting your work using Quick Capture</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="captureModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">New Entry</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="recording-indicator" id="recordingIndicator">
                <div class="pulse"></div>
                Recording...
            </div>

            <form onsubmit="saveEntry(event)">
                <div class="input-group">
                    <label for="entryTitle">Title</label>
                    <input type="text" id="entryTitle" required placeholder="Brief description">
                </div>

                <div class="input-group">
                    <label for="entryContent">Content</label>
                    <textarea id="entryContent" required placeholder="Detailed notes..."></textarea>
                </div>

                <div class="input-group">
                    <label for="entryCategory">Category</label>
                    <select id="entryCategory">
                        <option value="meeting">Meeting</option>
                        <option value="decision">Decision</option>
                        <option value="idea">Idea</option>
                        <option value="task">Task/Project</option>
                        <option value="conversation">Conversation</option>
                        <option value="voice">Voice Note</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="entryTags">Tags (comma separated)</label>
                    <input type="text" id="entryTags" placeholder="project-x, urgent, client-meeting">
                </div>

                <div class="input-group" id="voiceControls" style="display: none;">
                    <button type="button" class="btn btn-primary" id="startRecording" onclick="startRecording()">
                        🎤 Start Recording
                    </button>
                    <button type="button" class="btn btn-secondary" id="stopRecording" onclick="stopRecording()" style="display: none;">
                        ⏹️ Stop Recording
                    </button>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">💾 Save Entry</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="viewTitle">Entry Details</h3>
                <button class="close-btn" onclick="closeViewModal()">&times;</button>
            </div>
            <div id="viewContent"></div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('workEntries')) || [];
        let currentCategory = 'meeting';
        let mediaRecorder = null;
        let audioChunks = [];

        function openModal(category) {
            currentCategory = category;
            const modal = document.getElementById('captureModal');
            const title = document.getElementById('modalTitle');
            const categorySelect = document.getElementById('entryCategory');
            const voiceControls = document.getElementById('voiceControls');
            
            const titles = {
                meeting: 'New Meeting Notes',
                decision: 'New Decision Log',
                idea: 'New Idea',
                task: 'New Task Update',
                conversation: 'New Conversation Summary',
                voice: 'New Voice Note'
            };
            
            title.textContent = titles[category] || 'New Entry';
            categorySelect.value = category;
            
            voiceControls.style.display = category === 'voice' ? 'block' : 'none';
            
            modal.classList.add('active');
            document.getElementById('entryTitle').focus();
        }

        function closeModal() {
            document.getElementById('captureModal').classList.remove('active');
            document.getElementById('entryTitle').value = '';
            document.getElementById('entryContent').value = '';
            document.getElementById('entryTags').value = '';
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        document.getElementById('entryContent').value += 
                            `\n[Voice recording saved - ${new Date().toLocaleTimeString()}]`;
                    };
                    reader.readAsDataURL(audioBlob);
                    
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                document.getElementById('startRecording').style.display = 'none';
                document.getElementById('stopRecording').style.display = 'inline-block';
                document.getElementById('recordingIndicator').classList.add('active');
            } catch (err) {
                alert('Could not access microphone. Please check permissions.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.getElementById('startRecording').style.display = 'inline-block';
                document.getElementById('stopRecording').style.display = 'none';
                document.getElementById('recordingIndicator').classList.remove('active');
            }
        }

        function saveEntry(event) {
            event.preventDefault();
            
            const entry = {
                id: Date.now(),
                title: document.getElementById('entryTitle').value,
                content: document.getElementById('entryContent').value,
                category: document.getElementById('entryCategory').value,
                tags: document.getElementById('entryTags').value.split(',').map(t => t.trim()).filter(t => t),
                timestamp: new Date().toISOString(),
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString()
            };
            
            entries.unshift(entry);
            localStorage.setItem('workEntries', JSON.stringify(entries));
            
            closeModal();
            renderEntries();
            updateStats();
        }

        function renderEntries(filteredEntries = null) {
            const list = document.getElementById('entriesList');
            const displayEntries = filteredEntries || entries;
            
            if (displayEntries.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <h3>${filteredEntries ? 'No matching entries' : 'No entries yet'}</h3>
                        <p>${filteredEntries ? 'Try a different search term' : 'Start documenting your work using Quick Capture'}</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = displayEntries.map(entry => `
                <div class="entry" onclick="viewEntry(${entry.id})">
                    <div class="entry-header">
                        <span class="entry-type">${getCategoryIcon(entry.category)} ${entry.category}</span>
                        <span class="entry-date">${entry.date} ${entry.time}</span>
                    </div>
                    <div class="entry-title">${entry.title}</div>
                    <div class="entry-content">${truncate(entry.content, 150)}</div>
                    ${entry.tags.length > 0 ? `
                        <div class="entry-tags">
                            ${entry.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function viewEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;

            const modal = document.getElementById('viewModal');
            const title = document.getElementById('viewTitle');
            const content = document.getElementById('viewContent');

            title.textContent = entry.title;
            content.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <span class="entry-type">${getCategoryIcon(entry.category)} ${entry.category}</span>
                    <span style="color: #718096; font-size: 14px; margin-left: 15px;">${entry.date} ${entry.time}</span>
                </div>
                ${entry.tags.length > 0 ? `
                    <div class="entry-tags" style="margin-bottom: 20px;">
                        ${entry.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                ` : ''}
                <div style="color: #4a5568; line-height: 1.8; white-space: pre-wrap;">${entry.content}</div>
                <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e2e8f0;">
                    <button class="btn btn-secondary" onclick="deleteEntry(${entry.id})">🗑️ Delete Entry</button>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('active');
        }

        function deleteEntry(id) {
            if (confirm('Delete this entry?')) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('workEntries', JSON.stringify(entries));
                closeViewModal();
                renderEntries();
                updateStats();
            }
        }

        function filterEntries() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (!search) {
                renderEntries();
                return;
            }

            const filtered = entries.filter(entry => 
                entry.title.toLowerCase().includes(search) ||
                entry.content.toLowerCase().includes(search) ||
                entry.category.toLowerCase().includes(search) ||
                entry.tags.some(tag => tag.toLowerCase().includes(search))
            );

            renderEntries(filtered);
        }

        function updateStats() {
            document.getElementById('totalEntries').textContent = entries.length;
            
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            const thisWeekCount = entries.filter(e => new Date(e.timestamp) > oneWeekAgo).length;
            document.getElementById('thisWeek').textContent = thisWeekCount;
            
            const uniqueCategories = new Set(entries.map(e => e.category));
            document.getElementById('categories').textContent = uniqueCategories.size;
        }

        function getCategoryIcon(category) {
            const icons = {
                meeting: '💼',
                decision: '🎯',
                idea: '💡',
                task: '✅',
                conversation: '💬',
                voice: '🎤',
                other: '📝'
            };
            return icons[category] || '📝';
        }

        function truncate(text, length) {
            return text.length > length ? text.substring(0, length) + '...' : text;
        }

        renderEntries();
        updateStats();
    </script>
</body>
</html>
