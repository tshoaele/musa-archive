<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* ===================== TOKENS ===================== */
:root {
  --accent: #e8a838;
  --font-display: 'Cinzel', Georgia, serif;
  --font-body: 'Raleway', sans-serif;
  --radius-sm: 12px;
  --transition: 0.45s cubic-bezier(0.22,1,0.36,1);
}

/* DARK THEME (default) */
body.theme-dark {
  --glass: rgba(10,8,20,0.58);
  --glass-border: rgba(255,255,255,0.10);
  --text: #f0ece0;
  --text-muted: rgba(240,236,224,0.52);
  --overlay-top: rgba(10,8,20,0.10);
  --overlay-bottom: rgba(10,8,20,0.86);
  --bg-fallback: #0a0814;
  --img-filter: saturate(0.8) brightness(0.52) contrast(1.1);
  --img-filter-night: saturate(0.35) brightness(0.3) contrast(1.15);
  --img-filter-dawn: saturate(0.6) brightness(0.45) contrast(1.1) sepia(0.15);
}

/* LIGHT THEME */
body.theme-light {
  --glass: rgba(255,253,245,0.68);
  --glass-border: rgba(0,0,0,0.08);
  --text: #1a1612;
  --text-muted: rgba(26,22,18,0.52);
  --overlay-top: rgba(255,250,235,0.18);
  --overlay-bottom: rgba(255,245,210,0.82);
  --bg-fallback: #f5f0e8;
  --img-filter: saturate(0.55) brightness(0.75) contrast(0.95);
  --img-filter-night: saturate(0.3) brightness(0.55) contrast(1.0);
  --img-filter-dawn: saturate(0.5) brightness(0.7) contrast(0.95) sepia(0.2);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: var(--font-body);
  background: var(--bg-fallback);
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition);
}

/* ===================== BG LAYER ===================== */
#bg-layer {
  position: fixed; inset: 0; z-index: 0;
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  overflow: hidden;
}

.bg-char { position: relative; height: 100vh; overflow: hidden; }

.bg-char img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: top center; display: block;
  filter: var(--img-filter);
  transition: filter 2.5s ease;
  animation: subtlePan 22s ease-in-out infinite alternate;
  will-change: transform;
}

.bg-char:nth-child(1) img { animation-delay: 0s; }
.bg-char:nth-child(2) img { animation-delay: -8s; }
.bg-char:nth-child(3) img { animation-delay: -16s; }

@keyframes subtlePan {
  from { transform: scale(1.07) translateY(0px); }
  to   { transform: scale(1.07) translateY(-14px); }
}

.bg-char::after {
  content: ''; position: absolute; top: 0; right: 0;
  width: 1px; height: 100%;
  background: linear-gradient(to bottom,
    transparent 0%, rgba(128,128,128,0.08) 30%,
    rgba(128,128,128,0.14) 50%, rgba(128,128,128,0.08) 70%, transparent 100%
  );
  z-index: 2;
}
.bg-char:last-child::after { display: none; }

#bg-layer::after {
  content: ''; position: fixed; inset: 0;
  background: linear-gradient(to bottom,
    var(--overlay-top) 0%, transparent 25%,
    transparent 55%, var(--overlay-bottom) 100%
  );
  z-index: 1; pointer-events: none;
  transition: background var(--transition);
}

#grain {
  position: fixed; inset: 0; z-index: 2;
  pointer-events: none; opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ===================== APP ===================== */
#app { position: relative; z-index: 3; width: 100%; height: 100vh; display: flex; flex-direction: column; }

/* ===================== LOADING ===================== */
#loading-view {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  background: var(--bg-fallback);
}
.spinner {
  width: 38px; height: 38px;
  border: 2px solid rgba(232,168,56,0.2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-view p {
  font-family: var(--font-display); font-size: 0.72rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
}

/* ===================== ERROR ===================== */
#error-view {
  display: none; position: fixed; inset: 0; z-index: 20;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 32px; text-align: center;
  background: rgba(10,8,20,0.94);
}
#error-view h2 { font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); letter-spacing: 0.06em; }
#error-view p  { font-size: 0.86rem; color: var(--text-muted); max-width: 300px; line-height: 1.6; }
#error-view button {
  padding: 10px 28px; border-radius: var(--radius-sm);
  border: 1px solid var(--accent); background: transparent;
  color: var(--accent); font-family: var(--font-display);
  font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; transition: background 0.2s;
}
#error-view button:hover { background: rgba(232,168,56,0.15); }

/* ===================== MAIN VIEW ===================== */
#main-view {
  display: none; flex-direction: column;
  height: 100%; padding: 24px 28px 20px;
  justify-content: space-between;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
#main-view.visible { animation: fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) forwards; }

/* TOP ROW */
.top-row { display: flex; align-items: flex-start; justify-content: space-between; }
.location-eyebrow {
  font-size: 0.6rem; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px;
}
.location-name {
  font-family: var(--font-display); font-size: 1.35rem;
  color: var(--text); letter-spacing: 0.04em;
  text-shadow: 0 2px 24px rgba(0,0,0,0.5);
}

/* TOP-RIGHT CONTROLS: theme toggle + settings */
.controls-wrap { display: flex; align-items: center; gap: 10px; }

.icon-btn {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 50%; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; color: var(--text-muted);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: border-color 0.2s, color 0.2s, transform 0.2s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.1); }

/* ===================== HERO — clock above temp ===================== */
.hero {
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
}

.clock-block { text-align: center; margin-bottom: 4px; }
.clock-main {
  font-family: var(--font-display); font-size: 2.2rem;
  color: var(--text); letter-spacing: 0.1em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 24px rgba(0,0,0,0.5);
  line-height: 1;
}
.clock-sep { opacity: 0.3; }
.clock-secs {
  font-size: 0.75rem; color: var(--text-muted);
  font-variant-numeric: tabular-nums; letter-spacing: 0.08em;
  margin-top: 2px;
}

.condition-text {
  font-size: 0.68rem; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); margin-top: 4px;
}
.temp-big {
  font-family: var(--font-display);
  font-size: clamp(5rem, 19vw, 8.5rem);
  line-height: 0.88; color: var(--text);
  letter-spacing: -0.02em;
  text-shadow: 0 4px 48px rgba(0,0,0,0.7), 0 0 80px rgba(232,168,56,0.1);
}
.temp-unit { font-size: 0.32em; vertical-align: super; color: var(--accent); }
.feels-row { font-size: 0.76rem; color: var(--text-muted); letter-spacing: 0.05em; }
.highlow-row { font-size: 0.76rem; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 1px; }
.highlow-row span { color: var(--text); font-weight: 500; }

/* ===================== CHAR STRIP ===================== */
.char-strip { display: flex; }
.char-name {
  flex: 1; text-align: center;
  font-family: var(--font-display); font-size: 0.56rem;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(128,128,128,0.3);
}

/* ===================== STATS ===================== */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-card {
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); padding: 12px 10px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  transition: background var(--transition), border-color var(--transition);
}
.stat-label {
  font-size: 0.58rem; font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;
}
.stat-value { font-family: var(--font-display); font-size: 1.2rem; color: var(--text); }
.stat-unit { font-size: 0.58rem; color: var(--text-muted); font-family: var(--font-body); margin-left: 1px; }

/* UV label colour coding */
.uv-low    { color: #4caf82; }
.uv-mod    { color: #e8c838; }
.uv-high   { color: #e87838; }
.uv-vhigh  { color: #c0392b; }

/* ===================== FORECAST ===================== */
.forecast-row {
  display: flex; gap: 7px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.forecast-row::-webkit-scrollbar { display: none; }
.forecast-card {
  flex: 0 0 auto; min-width: 54px;
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); padding: 9px 8px; text-align: center;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  transition: background var(--transition);
}
.forecast-time { font-size: 0.58rem; color: var(--text-muted); letter-spacing: 0.07em; margin-bottom: 4px; }
.forecast-icon { font-size: 1rem; margin-bottom: 3px; }
.forecast-temp { font-family: var(--font-display); font-size: 0.85rem; color: var(--text); }

/* ===================== FOOTER ===================== */
.footer-row { display: flex; align-items: center; justify-content: space-between; }
.updated-label { font-size: 0.64rem; color: var(--text-muted); letter-spacing: 0.06em; }
.refresh-btn {
  background: none; border: 1px solid var(--glass-border);
  border-radius: 50%; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); font-size: 0.9rem;
  transition: border-color 0.2s, color 0.2s, transform 0.35s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(180deg); }

/* ===================== SETTINGS PANEL ===================== */
#settings-panel {
  display: none;
  position: fixed; inset: 0; z-index: 30;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  padding: 24px;
}
#settings-panel.open { display: flex; }

.settings-box {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 28px 24px;
  width: 100%; max-width: 380px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}
.settings-title {
  font-family: var(--font-display); font-size: 0.85rem;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 20px; text-align: center;
}
.settings-section-label {
  font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 12px; font-weight: 500;
}
.image-slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }

.img-slot {
  position: relative; aspect-ratio: 2/3;
  border-radius: 10px; overflow: hidden;
  border: 1px dashed var(--glass-border);
  cursor: pointer; background: rgba(128,128,128,0.1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
}
.img-slot:hover { border-color: var(--accent); }
.img-slot img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  filter: none !important; animation: none !important;
}
.img-slot-label {
  font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); z-index: 1; pointer-events: none;
}
.img-slot-icon { font-size: 1.2rem; z-index: 1; pointer-events: none; }
.img-slot input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}

.settings-close {
  width: 100%; padding: 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent);
  background: transparent; color: var(--accent);
  font-family: var(--font-display); font-size: 0.72rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; transition: background 0.2s; margin-top: 4px;
}
.settings-close:hover { background: rgba(232,168,56,0.15); }
</style>
</head>

    <button class="settings-close" onclick="closeSettings()">Done</button>
  </div>
</div>

<script>
// ============================================================
// UTILS
// ============================================================
function padZ(n) { return String(n).padStart(2, '0'); }

function showView(id) {
  ['loading-view','error-view','main-view'].forEach(v => {
    document.getElementById(v).style.display = (v === id) ? 'flex' : 'none';
  });
  if (id === 'main-view') document.getElementById('main-view').classList.add('visible');
}

// ============================================================
// THEME TOGGLE
// ============================================================
let currentTheme = localStorage.getItem('wx-theme') || 'dark';

function applyTheme(theme) {
  document.body.classList.remove('theme-dark','theme-light');
  document.body.classList.add('theme-' + theme);
  document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  currentTheme = theme;
  localStorage.setItem('wx-theme', theme);
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

// ============================================================
// TIME FILTER — shifts image brightness by time of day
// ============================================================
function applyTimeFilter(hour) {
  const isNight = hour >= 21 || hour < 6;
  const isDawn  = hour >= 6 && hour < 9;
  document.querySelectorAll('.bg-char img').forEach(img => {
    const prop = isNight ? '--img-filter-night' : isDawn ? '--img-filter-dawn' : '--img-filter';
    img.style.filter = getComputedStyle(document.body).getPropertyValue(prop).trim();
  });
}

// ============================================================
// CLOCK
// ============================================================
function tickClock() {
  const now = new Date();
  document.getElementById('time-h').textContent = padZ(now.getHours());
  document.getElementById('time-m').textContent = padZ(now.getMinutes());
  document.getElementById('time-s').textContent = padZ(now.getSeconds());
  applyTimeFilter(now.getHours());
}

// ============================================================
// UV INDEX — colour coding + label
// ============================================================
function uvLabel(val) {
  if (val === null || val === undefined) return { text: '--', cls: '' };
  const v = parseFloat(val);
  if (v <= 2)  return { text: v.toFixed(1) + ' Low',       cls: 'uv-low' };
  if (v <= 5)  return { text: v.toFixed(1) + ' Moderate',  cls: 'uv-mod' };
  if (v <= 7)  return { text: v.toFixed(1) + ' High',      cls: 'uv-high' };
  return               { text: v.toFixed(1) + ' V.High',   cls: 'uv-vhigh' };
}

// ============================================================
// WMO MAP
// ============================================================
const WMO_MAP = {
  0:{label:'Clear Sky',icon:'☀️'}, 1:{label:'Mainly Clear',icon:'🌤️'},
  2:{label:'Partly Cloudy',icon:'⛅'}, 3:{label:'Overcast',icon:'☁️'},
  45:{label:'Fog',icon:'🌫️'}, 48:{label:'Icy Fog',icon:'🌫️'},
  51:{label:'Light Drizzle',icon:'🌦️'}, 53:{label:'Drizzle',icon:'🌦️'},
  55:{label:'Heavy Drizzle',icon:'🌧️'}, 61:{label:'Light Rain',icon:'🌧️'},
  63:{label:'Rain',icon:'🌧️'}, 65:{label:'Heavy Rain',icon:'🌧️'},
  71:{label:'Light Snow',icon:'🌨️'}, 73:{label:'Snow',icon:'❄️'},
  75:{label:'Heavy Snow',icon:'❄️'}, 80:{label:'Rain Showers',icon:'🌦️'},
  81:{label:'Heavy Showers',icon:'🌧️'}, 95:{label:'Thunderstorm',icon:'⛈️'},
  99:{label:'Hail Storm',icon:'⛈️'}
};
function wmo(code) { return WMO_MAP[code] || {label:'Unknown',icon:'🌡️'}; }

// ============================================================
// FETCH
// ============================================================
async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,relativehumidity_2m,uv_index` +
    `&daily=temperature_2m_max,temperature_2m_min` +
    `&hourly=temperature_2m,weathercode&timezone=auto&forecast_days=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Weather fetch failed: ${res.status}`);
  try { return await res.json(); }
  catch { throw new Error('Invalid JSON from weather API'); }
}

async function fetchLocationName(lat, lon) {
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
      { headers: { 'Accept-Language': 'en' } }
    );
    if (!res.ok) return 'Your Location';
    const d = await res.json();
    return d.address?.city || d.address?.town || d.address?.suburb || d.address?.county || 'Your Location';
  } catch { return 'Your Location'; }
}

// ============================================================
// RENDER
// ============================================================
function renderWeather(data, locationName) {
  const c = data.current;
  const cond = wmo(c.weathercode);

  document.getElementById('location-name').textContent = locationName;
  document.getElementById('condition-label').textContent = cond.label;
  document.getElementById('temp-display').innerHTML =
    `${Math.round(c.temperature_2m)}<span class="temp-unit">°C</span>`;
  document.getElementById('feels-like').textContent =
    `Feels like ${Math.round(c.apparent_temperature)}°`;

  // Daily high / low
  const hi = data.daily?.temperature_2m_max?.[0];
  const lo = data.daily?.temperature_2m_min?.[0];
  document.getElementById('temp-high').textContent = hi != null ? Math.round(hi) : '--';
  document.getElementById('temp-low').textContent  = lo != null ? Math.round(lo) : '--';

  document.getElementById('stat-humidity').innerHTML =
    `${c.relativehumidity_2m}<span class="stat-unit">%</span>`;
  document.getElementById('stat-wind').innerHTML =
    `${Math.round(c.windspeed_10m)}<span class="stat-unit">km/h</span>`;

  // UV with colour coding
  const uv = uvLabel(c.uv_index);
  const uvEl = document.getElementById('stat-uv');
  uvEl.className = 'stat-value ' + uv.cls;
  uvEl.textContent = uv.text;

  // Hourly forecast
  const forecastRow = document.getElementById('forecast-row');
  forecastRow.innerHTML = '';
  const currentHour = new Date().getHours();
  for (let i = 1; i <= 6; i++) {
    const idx = currentHour + i;
    if (idx >= data.hourly.time.length) break;
    const time = new Date(data.hourly.time[idx]);
    const card = document.createElement('div');
    card.className = 'forecast-card';
    card.innerHTML = `
      <div class="forecast-time">${padZ(time.getHours())}:00</div>
      <div class="forecast-icon">${wmo(data.hourly.weathercode[idx]).icon}</div>
      <div class="forecast-temp">${Math.round(data.hourly.temperature_2m[idx])}°</div>`;
    forecastRow.appendChild(card);
  }

  const now = new Date();
  document.getElementById('updated-label').textContent =
    `Updated ${padZ(now.getHours())}:${padZ(now.getMinutes())}`;

  showView('main-view');
}

// ============================================================
// LOAD WEATHER
// ============================================================
async function loadWeather() {
  showView('loading-view');
  try {
    const pos = await new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('Geolocation not supported')); return; }
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        timeout: 10000, maximumAge: 300000
      });
    });
    const { latitude: lat, longitude: lon } = pos.coords;
    const [weather, locationName] = await Promise.all([
      fetchWeather(lat, lon), fetchLocationName(lat, lon)
    ]);
    renderWeather(weather, locationName);
  } catch(err) {
    console.error('Weather load error:', err);
    document.getElementById('error-msg').textContent = err.code === 1
      ? 'Location access denied. Please allow location in your browser settings.'
      : 'Could not fetch weather. Check your connection and try again.';
    showView('error-view');
  }
}

function retryInit() { loadWeather(); }

// ============================================================
// SETTINGS — IMAGE UPLOAD
// ============================================================
function openSettings()  { document.getElementById('settings-panel').classList.add('open'); }
function closeSettings() { document.getElementById('settings-panel').classList.remove('open'); }

function handleImageUpload(slotIndex, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const src = e.target.result;
    // Update wallpaper
    document.getElementById('bg-img-' + slotIndex).src = src;
    // Update settings preview
    document.getElementById('slot-preview-' + slotIndex).src = src;
  };
  reader.readAsDataURL(file);
}

// Close settings panel when clicking outside the box
document.getElementById('settings-panel').addEventListener('click', e => {
  if (e.target === document.getElementById('settings-panel')) closeSettings();
});

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(currentTheme);
  tickClock();
  setInterval(tickClock, 1000);
  loadWeather();
  setInterval(loadWeather, 5 * 60 * 1000);
